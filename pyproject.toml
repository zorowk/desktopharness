[project]
name = "treeland-autogui-mcp"
version = "0.2.0"
description = "Automatic operation of on-screen GUI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.4.0",
    "pyautogui",
    "mcp[cli]>=1.3.0",
    "httpx>=0.28.1",
    "openai>=2.36.0",
]
license = {text = "MIT License"}
license-files = ["LICENSE"]

[project.scripts]
treeland-autogui-mcp = "mcp_autogui:cli_main"
autoui-audit = "mcp_autogui.audit_cli:main"
autoui-smoke = "mcp_autogui.smoke:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/mcp_autogui"
]

[project.optional-dependencies]
langchain = [
    "google-genai>=1.71.0",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.1",
    "langchain-mcp",
    "langchain-openai>=1.1.12",
    "langgraph",
    "python-dotenv>=1.0.1",
]
omniparser = ["requests>=2.32.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
langchain-mcp = { git = "https://github.com/NON906/langchain-mcp.git", branch = "main" }
pyautogui = { git = "https://github.com/zorowk/pyautogui.git", branch = "master" }
